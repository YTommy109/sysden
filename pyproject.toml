[project]
name = "sysden"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.49.0",
    "openai>=2.44.0",
    "markdown-it-py>=4.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov",
    "pytest-playwright>=0.8.0",
    "httpx>=0.28.1",
    "ruff>=0.15.20",
    "ty",
    "pre-commit>=4.6.0",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
setup     = "uv run pre-commit install --hook-type pre-commit --hook-type post-checkout"
dev       = "uv run uvicorn app.main:app --reload --port 8000"
test      = "uv run pytest -v --cov --cov-report=term-missing"
lint      = "uv run ruff check ."
format    = "uv run ruff format ."
typecheck = "uv run ty check"
e2e       = "uv run pytest tests/e2e -v"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "C901", # mccabe cognitive complexity
    "I",    # isort
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bugs)
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (no print statements)
    "N",    # pep8-naming
]
mccabe.max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
