<aside id="chat-panel" style="display:none;">
  <div id="chat-header">
    <span>チャット</span>
    <button type="button" id="chat-reset-btn" aria-label="会話をリセット" title="会話をリセット">
      <img src="/static/icons/arrow-path-circle.svg" alt="" width="18" height="18">
    </button>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-area">
    <textarea id="chat-input" rows="2" placeholder="メッセージを入力..."></textarea>
    <button type="button" id="chat-send-btn" aria-label="送信" title="送信">
      <img src="/static/icons/paper-airplane.svg" alt="" width="18" height="18">
    </button>
  </div>
</aside>
