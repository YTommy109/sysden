<div sse-connect="{{ sse_url }}"
     hx-trigger="sse:complete" hx-get="/"
     hx-select="{{ target }}" hx-target="{{ target }}" hx-swap="outerHTML"
     style="margin:0;">
  <button type="button" disabled aria-label="{{ label }}" title="{{ label }}"
          style="background:#555; padding:0.3rem 0.45rem; line-height:0;">
    <img src="/static/icons/arrow-path.svg" alt=""
         style="width:1.1rem; height:1.1rem;" class="spinning">
  </button>
</div>
