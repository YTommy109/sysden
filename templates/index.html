{% extends "base.html" %}
{% block title %}テーブル一覧 — sysden{% endblock %}
{% block content %}
<h1>テーブル設計一覧</h1>

<div id="table-list">
  {% for name in tables %}
  <div class="card" style="display:flex; align-items:center; gap:0.75rem;">
    <strong style="flex:1;">{{ name }}</strong>
    <a href="/tables/{{ name }}" style="padding:0.4rem 1rem; background:#1a1a2e; color:white; text-decoration:none; border-radius:3px;">参照・編集</a>
    <button hx-delete="/api/tables/{{ name }}"
            hx-confirm="{{ name }} を削除しますか？"
            hx-target="closest .card"
            hx-swap="outerHTML"
            style="background:#c00; padding:0.4rem 0.75rem; border:none; color:white; cursor:pointer; border-radius:3px;">削除</button>
  </div>
  {% else %}
  <p>テーブル設計はまだありません。</p>
  {% endfor %}
</div>

<h2>AI に新規テーブル設計を依頼</h2>
<form method="post" action="/api/tables">
  <input name="name" placeholder="テーブル名（例: users）" required>
  <textarea name="prompt" rows="3" placeholder="どんなテーブルか説明してください"></textarea>
  <button type="submit">依頼を送信</button>
</form>
{% endblock %}
