{% extends "base.html" %}
{% block title %}テーブル一覧 — sysden{% endblock %}
{% block content %}
<div style="display:flex; align-items:center; justify-content:space-between;">
  <h1>テーブル設計一覧</h1>
  <button type="button"
          _="on click call #create-dialog.showModal()"
          style="height:fit-content;">テーブル追加</button>
</div>

<dialog id="create-dialog">
  <h2>AI に新規テーブル設計を依頼</h2>
  <form method="post" action="/api/tables"
        _="on keydown if event.key is 'Enter' and (event.metaKey or event.ctrlKey) halt the event then call me.requestSubmit()">
    <textarea name="prompt" rows="7" placeholder="どんなテーブルか説明してください（例: ユーザー管理テーブルを作って）" required></textarea>
    <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
      <button type="button"
              _="on click call #create-dialog.close()"
              style="background:#666;">キャンセル</button>
      <button type="submit">依頼を送信</button>
    </div>
  </form>
</dialog>


<div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
  <form method="post" action="/api/rebuild-index-tables" style="margin:0;">
    <button type="submit" style="background:#555; font-size:0.85rem;">テーブル一覧の再作成</button>
  </form>
  <form method="post" action="/api/rebuild-er-diagram" style="margin:0;">
    <button type="submit" style="background:#555; font-size:0.85rem;">ER 図の再作成</button>
  </form>
</div>

{% if er_diagram %}
<div id="er-diagram">
  <pre class="mermaid">{{ er_diagram }}</pre>
</div>
{% endif %}

<div id="table-list">
  {% for name in tables %}
  <div class="card" style="display:flex; align-items:center; gap:0.75rem;">
    <strong style="flex:1;">{{ name }}</strong>
    <a href="/tables/{{ name }}" style="padding:0.4rem 1rem; background:#1a1a2e; color:white; text-decoration:none; border-radius:3px;">参照・編集</a>
    <button hx-delete="/api/tables/{{ name }}"
            hx-confirm="{{ name }} を削除しますか？"
            hx-target="closest .card"
            hx-swap="outerHTML"
            style="background:#c00; padding:0.4rem 0.75rem; border:none; color:white; cursor:pointer; border-radius:3px;">削除</button>
  </div>
  {% else %}
  <p>テーブル設計はまだありません。</p>
  {% endfor %}
</div>
{% endblock %}
