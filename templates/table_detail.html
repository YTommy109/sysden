{% extends "base.html" %}
{% block title %}{{ display_name }} — sysden{% endblock %}
{% block content %}
<div style="display:flex; align-items:center; gap:0.75rem;">
  <a href="/" aria-label="一覧に戻る" title="一覧に戻る" style="display:inline-flex; color:inherit;">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:1.25rem; height:1.25rem;">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
    </svg>
  </a>
  <h1 style="margin:0;">{{ display_name }}</h1>
</div>

<div id="table-view" style="margin-top: 1rem;">
  {{ rendered | safe }}
</div>

<h2>AI に更新を依頼</h2>
<form method="post" action="/api/tables/{{ name }}">
  <textarea name="prompt" rows="3" placeholder="変更内容を説明してください"></textarea>
  <button type="submit">更新を依頼</button>
</form>
{% endblock %}
